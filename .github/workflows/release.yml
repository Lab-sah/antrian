name: Build exe dan release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Sematkan ikon Erzap ke exe
        shell: bash
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)/bin/rsrc" -ico erzap.ico -arch amd64 -o rsrc_windows_amd64.syso

      - name: Build exe
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w" -o erzap-kiosk-antrean.exe .

      - name: Simpan exe sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: erzap-kiosk-antrean
          path: erzap-kiosk-antrean.exe

      - name: Buat release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            erzap-kiosk-antrean.exe \
            erzap-kiosk-antrean.bat \
            --title "$GITHUB_REF_NAME" \
            --notes "Launcher kiosk antrean Erzap untuk Windows.

          - erzap-kiosk-antrean.exe: jalankan langsung. Saat pertama kali akan meminta paste link kiosk, lalu menyimpannya ke link.md di sebelah exe.
          - erzap-kiosk-antrean.bat: versi skrip, fungsinya sama."
